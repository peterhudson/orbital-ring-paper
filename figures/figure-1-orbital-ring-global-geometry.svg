      .axis { fill: none; stroke: #94a3b8; stroke-width: 2.2; stroke-dasharray: 7 8; }
      .leader { fill: none; stroke: #9ca3af; stroke-width: 1.8; }
      .earth-label { font-size: 30px; font-weight: 600; }
      .label { font-size: 27px; font-weight: 500; }
      .label-small { font-size: 24px; font-weight: 500; }
      .math { font-size: 29px; font-style: italic; }
      .label-box { fill: #ffffff; stroke: #e2e8f0; stroke-width: 0.9; opacity: 0.92; }
      .center-dot { fill: #374151; }
    ]]></style>
