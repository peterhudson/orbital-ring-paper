<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="900" viewBox="0 0 1200 900" role="img" aria-labelledby="title desc">
  <title id="title">Figure 1 orbital ring global geometry</title>
  <desc id="desc">Earth shown from the side with an equatorial orbital ring rendered as a slightly tilted hoop. The visible front portion is solid, the part occluded by Earth is dashed, and labels mark Earth, the Earth rotation axis, a local sector enlarged in Figure 2, and the radius R.</desc>
