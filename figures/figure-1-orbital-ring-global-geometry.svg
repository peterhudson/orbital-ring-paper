      .ring-visible { fill: none; stroke: #4b5563; stroke-width: 3.8; stroke-linecap: round; stroke-linejoin: round; }
      .ring-hidden { fill: none; stroke: #98a2b3; stroke-width: 3.0; stroke-dasharray: 10 10; stroke-linecap: round; stroke-linejoin: round; }
