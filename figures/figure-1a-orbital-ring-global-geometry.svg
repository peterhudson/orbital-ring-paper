      .ring-back { fill: none; stroke: #9aa3af; stroke-width: 3.0; stroke-dasharray: 10 10; stroke-linecap: round; }
      .ring-front { fill: none; stroke: #4b5563; stroke-width: 3.6; stroke-linecap: round; }
      .sector { fill: none; stroke: #c64e35; stroke-width: 6.6; stroke-linecap: round; }
      .radius { fill: none; stroke: #374151; stroke-width: 2.6; }
      .leader { fill: none; stroke: #9ca3af; stroke-width: 1.8; }
      .earth-label { font-size: 30px; font-weight: 600; }
      .label { font-size: 28px; font-weight: 500; }
      .math { font-size: 29px; font-style: italic; }
      .label-box { fill: #ffffff; stroke: #e2e8f0; stroke-width: 0.9; opacity: 0.92; }
      .center-dot { fill: #374151; }
    ]]></style>
  </defs>
