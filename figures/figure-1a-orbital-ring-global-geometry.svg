<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="1200" viewBox="0 0 1200 1200" role="img" aria-labelledby="title desc">
  <title id="title">Orbital ring global geometry</title>
  <desc id="desc">A single clean global orbital-ring geometry diagram showing Earth, the ring centerline, radius R, altitude h, a highlighted local sector, inward gravity direction g_h, and tangential guide-shell inertial speed U_g.</desc>
  <defs>
    <marker id="arrow-dark" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#374151"/>
    </marker>
    <marker id="arrow-soft" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#6b7280"/>
    </marker>
    <style><![CDATA[
      text { font-family: Arial, Helvetica, sans-serif; fill: #1f2937; }
      .earth-fill { fill: #dfe7f0; }
      .earth-stroke { fill: none; stroke: #475569; stroke-width: 3; }
      .ring { fill: none; stroke: #6b7280; stroke-width: 2.5; }
      .sector { fill: none; stroke: #c84c31; stroke-width: 7; stroke-linecap: round; }
      .geom { fill: none; stroke: #374151; stroke-width: 2.6; }
      .dim { fill: none; stroke: #6b7280; stroke-width: 2.2; }
      .leader { fill: none; stroke: #9ca3af; stroke-width: 1.8; }
      .label { font-size: 29px; font-weight: 500; }
      .math { font-size: 29px; font-style: italic; }
      .earth-label { font-size: 30px; font-weight: 600; }
      .label-box { fill: #ffffff; stroke: #d7dde5; stroke-width: 1.0; opacity: 0.96; }
      .center-dot { fill: #374151; }
    ]]></style>
  </defs>

  <rect width="1200" height="1200" fill="#ffffff"/>

  <g id="earth">
    <circle cx="600" cy="600" r="360.00" class="earth-fill"/>
    <circle cx="600" cy="600" r="360.00" class="earth-stroke"/>
    <text x="600" y="622.00" class="earth-label" text-anchor="middle">Earth</text>
  </g>

  <g id="ring">
    <circle cx="600" cy="600" r="388.25" class="ring"/>
    <path d="M 918.04,377.31 A 388.25,388.25 0 1 0 988.19,593.22" class="sector"/>
  </g>

  <g id="dimensions">
    <circle cx="600" cy="600" r="4.5" class="center-dot"/>
    <path d="M 600.00,600.00 L 311.47,340.21" class="geom" marker-end="url(#arrow-dark)"/>
    <rect x="406.88" y="407.12" width="40" height="38" rx="8" class="label-box"/>
    <text x="426.88" y="436.12" class="math" text-anchor="middle">R</text>
    <path d="M 948.63,696.00 L 976.45,700.90" class="dim" marker-start="url(#arrow-soft)" marker-end="url(#arrow-soft)"/>
    <rect x="937.63" y="706.93" width="38" height="38" rx="8" class="label-box"/>
    <text x="956.63" y="735.93" class="math" text-anchor="middle">h</text>
  </g>

  <g id="vectors">
    <path d="M 997.78,470.75 L 885.56,507.22" class="dim" marker-end="url(#arrow-soft)"/>
    <text x="829.52" y="527.58" class="math">g_h</text>
    <path d="M 974.19,495.24 L 928.46,354.48" class="geom" marker-end="url(#arrow-dark)"/>
    <text x="925.19" y="333.95" class="math">U_g</text>
  </g>

  <g id="callouts">
    <path d="M 354.00,180.00 L 444.56,228.02" class="leader"/>
    <text x="170" y="190" class="label">ring centerline</text>
    <path d="M 928.04,369.31 L 970.00,156.00" class="leader"/>
    <text x="760" y="150" class="label">highlighted local sector</text>
  </g>
</svg>