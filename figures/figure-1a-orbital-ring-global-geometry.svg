  <title id="title">Figure 1a orbital ring global geometry</title>
  <desc id="desc">Side view of Earth with a slightly tilted equatorial orbital ring shown as a hoop, solid in front and dashed where occluded behind Earth. Labels mark Earth, ring centerline, a local sector, and the radius R.</desc>
