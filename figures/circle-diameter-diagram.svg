<svg xmlns="http://www.w3.org/2000/svg" width="800" height="600" viewBox="0 0 800 600" role="img" aria-labelledby="title desc">
  <title id="title">Circle with labelled diameter arrow</title>
  <desc id="desc">A simple technical diagram showing a circle with a horizontal diameter dimension arrow labelled Diameter D.</desc>

  <defs>
    <marker id="arrowhead" viewBox="0 0 10 10" refX="5" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#1f2937"/>
    </marker>
    <style>
      text {
        font-family: Arial, Helvetica, sans-serif;
        fill: #111827;
      }
      .outline {
        stroke: #111827;
        stroke-width: 3;
        fill: none;
      }
      .centerline {
        stroke: #9ca3af;
        stroke-width: 1.5;
        stroke-dasharray: 8 6;
      }
      .dimension {
        stroke: #1f2937;
        stroke-width: 2.5;
        fill: none;
        marker-start: url(#arrowhead);
        marker-end: url(#arrowhead);
      }
      .extension {
        stroke: #6b7280;
        stroke-width: 1.5;
      }
      .label {
        font-size: 28px;
        font-weight: 600;
      }
      .note {
        font-size: 18px;
        fill: #4b5563;
      }
    </style>
  </defs>

  <rect width="800" height="600" fill="#ffffff"/>

  <g id="circle">
    <circle class="outline" cx="400" cy="300" r="180"/>
  </g>

  <g id="reference">
    <line class="centerline" x1="400" y1="105" x2="400" y2="495"/>
  </g>

  <g id="dimensions">
    <line class="extension" x1="220" y1="300" x2="220" y2="250"/>
    <line class="extension" x1="580" y1="300" x2="580" y2="250"/>
    <line class="dimension" x1="230" y1="250" x2="570" y2="250"/>
    <text class="label" x="400" y="232" text-anchor="middle">Diameter D</text>
  </g>

  <g id="labels">
    <text class="note" x="400" y="540" text-anchor="middle">Simple technical diagram, not to scale</text>
  </g>
</svg>
