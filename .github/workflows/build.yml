name: Build book

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install Python packages
        run: pip install -r requirements.txt
      - name: Run the analysis tests
        run: python -m unittest discover -s tests -v

  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Quarto
        uses: quarto-dev/quarto-actions/setup@v2
        with:
          tinytex: true

      - name: Install rsvg-convert (SVG figures in the PDF)
        run: sudo apt-get update && sudo apt-get install -y librsvg2-bin

      - name: Render website and PDF
        run: quarto render

      - name: Upload PDF
        uses: actions/upload-artifact@v4
        with:
          name: orbital-ring-paper-pdf
          path: _book/orbital-ring-paper.pdf

      - name: Upload site
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request' && vars.PUBLISH_PAGES == 'true'
        uses: actions/upload-pages-artifact@v3
        with:
          path: _book

  # Publishing is off until GitHub Pages is enabled for the repository
  # (Settings > Pages > Source: GitHub Actions) and the repository variable
  # PUBLISH_PAGES is set to 'true' (Settings > Secrets and variables > Actions > Variables).
  deploy:
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request' && vars.PUBLISH_PAGES == 'true'
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
