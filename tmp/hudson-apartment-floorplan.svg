<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1120" viewBox="0 0 1600 1120" role="img" aria-labelledby="title desc">
  <title id="title">Hudson apartment floorplan trace</title>
  <desc id="desc">Clean vector reconstruction of the uploaded apartment floorplan, with labelled rooms, deck, kitchen, baths, entry, and main internal partitions.</desc>
  <!-- Reconstructed from the uploaded JPG as layout intent, not survey-grade geometry. -->
  <!-- Original reference image was supplied in chat and is not embedded here. -->
  <defs>
    <style>
      .room { stroke:#1f1f1f; stroke-width:12; stroke-linejoin:round; }
      .outer { stroke:#1f1f1f; stroke-width:14; stroke-linejoin:round; fill:none; }
      .inner { stroke:#1f1f1f; stroke-width:10; stroke-linejoin:round; fill:none; }
      .fixture { stroke:#7a7a7a; stroke-width:3; fill:none; }
      .fixture-fill { stroke:#7a7a7a; stroke-width:3; fill:#f8f8f8; }
      .door { stroke:#8a8a8a; stroke-width:3; fill:none; }
      .label { font-family: Arial, Helvetica, sans-serif; font-size: 22px; fill:#333; letter-spacing: 1px; text-anchor: middle; }
      .small { font-size:18px; }
      .deck { fill:#fafafa; }
      .living { fill:#f7f7f7; }
      .bed { fill:#fcfcfc; }
      .wet { fill:#f3f3f3; }
      .service { fill:#f8f8f8; }
    </style>
  </defs>

  <g id="reference_sketch" opacity="0" />

  <rect x="0" y="0" width="1600" height="1120" fill="white"/>

  <g id="rooms">
    <polygon id="deck" class="room deck" points="130,525 420,320 610,515 365,690 95,625"/>
    <polygon id="bedroom" class="room bed" points="65,625 365,690 610,725 610,990 65,990"/>
    <polygon id="bath" class="room wet" points="610,640 800,640 800,855 610,855"/>
    <polygon id="kitchen" class="room service" points="800,640 1100,640 1100,885 800,885"/>
    <polygon id="living-dining" class="room living" points="590,415 1040,145 1230,350 1230,560 1180,560 1180,640 590,640 590,520"/>
    <polygon id="master-bedroom" class="room bed" points="1040,145 1350,70 1500,220 1500,500 1290,500 1290,350 1230,350"/>
    <polygon id="closet-upper" class="room service" points="1230,560 1340,560 1340,705 1230,705"/>
    <polygon id="closet-lower" class="room service" points="1230,705 1340,705 1340,870 1230,870"/>
    <polygon id="ensuite" class="room wet" points="1340,560 1510,560 1510,930 1340,930"/>
    <polygon id="flex" class="room bed" points="780,885 1100,885 1100,1060 780,1060"/>
    <polygon id="entry-hall" class="room service" points="1100,640 1275,640 1275,1085 1100,1085"/>
  </g>

  <g id="outer_boundary">
    <path class="outer" d="M95 625 L130 525 L420 320 L1040 145 L1350 70 L1500 220 L1510 930 L1275 930 L1275 1085 L780 1060 L65 990 Z"/>
  </g>

  <g id="inner_partitions">
    <path class="inner" d="M365 690 L610 725"/>
    <path class="inner" d="M610 640 L610 990"/>
    <path class="inner" d="M800 640 L800 885"/>
    <path class="inner" d="M1100 640 L1100 1085"/>
    <path class="inner" d="M780 885 L1275 885"/>
    <path class="inner" d="M1230 350 L1230 870"/>
    <path class="inner" d="M1340 560 L1340 930"/>
    <path class="inner" d="M1230 705 L1340 705"/>
    <path class="inner" d="M1290 350 L1290 500"/>
  </g>

  <g id="fixtures">
    <rect class="fixture-fill" x="640" y="715" width="125" height="110" rx="2"/>
    <rect class="fixture" x="660" y="655" width="55" height="38"/>
    <ellipse class="fixture" cx="685" cy="760" rx="28" ry="34"/>

    <rect class="fixture" x="845" y="670" width="235" height="70"/>
    <rect class="fixture" x="860" y="680" width="70" height="50"/>
    <text x="1035" y="718" class="label small">DW</text>
    <rect class="fixture" x="880" y="835" width="80" height="35"/>
    <rect class="fixture" x="995" y="820" width="55" height="50"/>

    <rect class="fixture-fill" x="1250" y="585" width="70" height="95" rx="2"/>
    <path class="fixture" d="M1250 585 L1320 680 M1320 585 L1250 680"/>
    <rect class="fixture-fill" x="1250" y="735" width="70" height="110" rx="2"/>
    <path class="fixture" d="M1250 735 L1320 845 M1320 735 L1250 845"/>

    <rect class="fixture" x="1365" y="585" width="120" height="55"/>
    <line class="fixture" x1="1425" y1="585" x2="1425" y2="640"/>
    <ellipse class="fixture" cx="1425" cy="780" rx="34" ry="26"/>
    <rect class="fixture-fill" x="1360" y="840" width="130" height="70" rx="2"/>
  </g>

  <g id="doors">
    <path class="door" d="M462 463 L510 512 A68 68 0 0 1 448 565"/>
    <path class="door" d="M292 678 L350 688 A72 72 0 0 1 298 744"/>
    <path class="door" d="M1180 555 L1230 555 A78 78 0 0 1 1172 632"/>
    <path class="door" d="M1165 980 L1275 980 A110 110 0 0 1 1165 1090"/>
  </g>

  <g id="labels">
    <text x="350" y="545" class="label">DECK</text>
    <text x="255" y="840" class="label">BEDROOM</text>
    <text x="705" y="775" class="label">BATH</text>
    <text x="940" y="790" class="label">KITCHEN</text>
    <text x="925" y="520" class="label">LIVING / DINING</text>
    <text x="1325" y="270" class="label">
      <tspan x="1325" dy="0">MASTER</tspan>
      <tspan x="1325" dy="28">BEDROOM</tspan>
    </text>
    <text x="1425" y="725" class="label">ENSUITE</text>
    <text x="940" y="995" class="label">FLEX</text>
    <text x="1190" y="1040" class="label">ENTRY</text>
    <text x="1285" y="645" class="label small">W</text>
  </g>
</svg>
