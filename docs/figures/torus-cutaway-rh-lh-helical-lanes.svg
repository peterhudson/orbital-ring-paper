  <rect x="748" y="486" width="304" height="40" rx="12" fill="#fffdf9" opacity="0.94" stroke="#d9d1c3"/>
  <text x="764" y="512" class="calloutText" text-anchor="start">ring centerline direction s</text>

  <text x="84" y="620" class="note" text-anchor="start">Blue and orange lane families are drawn as shallow helices wrapped around the same torus tube.</text>
  <text x="84" y="648" class="note" text-anchor="start">A balanced architecture would carry both families together so their steady azimuthal channels can cancel.</text>

